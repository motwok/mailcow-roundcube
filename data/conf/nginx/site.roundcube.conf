server {
	listen 127.0.0.1:65511;
	http2 on;

	location = /rc-auth.php {
		fastcgi_pass phpfpm:9000;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /web/rc-auth.php;
		fastcgi_param RC_AUTH_INTERNAL $rc_auth_internal;
	}
}
 map $server_port $rc_auth_internal {
    65511   "1";
    default "";
}

server {
	listen 80;
	listen [::]:80;
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name roundcube.*;

	http2 on;
	ssl_certificate /etc/ssl/mail/cert.pem;
	ssl_certificate_key /etc/ssl/mail/key.pem;

	location /SOGo/ {
		return 301 /roundcube/;
	}

	location / {
		proxy_pass https://$http_host;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
